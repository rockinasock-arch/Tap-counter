name: Build Starter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write Clean Manifest
        run: python3 -c 'a="android"+chr(58); open("app/src/main/AndroidManifest.xml","w").write(f"<manifest xmlns{chr(58)}android=\"http{chr(58)}//://android.com\"><application {a}label=\"TapCounter\" {a}theme=\"@style/Theme.AppCompat.Light.DarkActionBar\"><activity {a}name=\".MainActivity\" {a}exported=\"true\"><intent-filter><action {a}name=\"android.intent.action.MAIN\"/><category {a}name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>")'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
